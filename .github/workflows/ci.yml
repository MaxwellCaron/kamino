name: CI

on:
  pull_request:
    branches: [main, development]
  workflow_call:
  workflow_dispatch:

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod

      - name: gofmt
        run: bash scripts/ci.sh api gofmt

      - name: build
        run: bash scripts/ci.sh api build

      - name: test
        run: bash scripts/ci.sh api test

      - name: sqlc-drift-check
        run: bash scripts/ci.sh api sqlc

      - name: govulncheck
        run: bash scripts/ci.sh api vuln

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: install
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bash scripts/ci.sh web typecheck

      - name: typecheck (secondary compiler, non-blocking)
        run: bun run typecheck:stable
        continue-on-error: true

      - name: lint
        run: bash scripts/ci.sh web lint

      - name: test
        run: bash scripts/ci.sh web test

      - name: react-doctor
        uses: millionco/react-doctor@v2
        with:
          directory: apps/web
          scope: changed
          blocking: warning
