apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: signoz
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.signoz.io
      chart: signoz
      targetRevision: 0.138.0
      helm:
        valueFiles:
          - $values/deploy/observability/signoz-values.yaml
    - repoURL: https://github.com/MaxwellCaron/kamino.git
      targetRevision: development
      ref: values
    - repoURL: https://github.com/MaxwellCaron/kamino.git
      targetRevision: development
      path: deploy/observability/access
  destination:
    server: https://kubernetes.default.svc
    namespace: signoz
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
