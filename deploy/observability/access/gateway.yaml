apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: signoz-gateway
  namespace: signoz
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: signoz-tls
      hosts:
        - signoz.placeholder.invalid
