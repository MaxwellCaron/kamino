apiVersion: batch/v1
kind: CronJob
metadata:
  name: kamino-principal-sync
  labels:
    app.kubernetes.io/name: kamino-principal-sync
    app.kubernetes.io/component: principal-sync
    app.kubernetes.io/part-of: kamino
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1200
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kamino-principal-sync
            app.kubernetes.io/component: principal-sync
            app.kubernetes.io/part-of: kamino
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: principal-sync
              image: ghcr.io/maxwellcaron/kamino-api:latest
              imagePullPolicy: Always
              command:
                - /app/api
                - principal-sync
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsUser: 10001
              envFrom:
                - configMapRef:
                    name: kamino-config
                - secretRef:
                    name: kamino-secrets
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
